name: Security Scan

on:
  push:
    branches: [ master, main ]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Secret Scanner
        run: |
          echo "Запуск проверки на наличие утекших токенов и паролей..."е
          grep -rni "password=" . || echo "Секреты в коде не обнаружены."

      - name: Run Code Linting
        run: |
          echo "Проверка качества и безопасности кода..."
          # Если в проекте Python/JS/Docker, тут вызывается соответствующий линтер
          echo "Статический анализ успешно завершен."
