name: Security Scan

on:
  push:
    branches: [ master, main ]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy via Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/apps \
            aquasec/trivy:0.50.0 \
            config /apps
