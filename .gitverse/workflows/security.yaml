name: Security Scan

on:
  push:
    branches: [ master, main ]

jobs:
  security-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Secret Scanner
        run: |
          echo "Запуск проверки на наличие утекших токенов и паролей..."
          grep -rni "password=" . || echo "Секреты в коде не обнаружены."

      - name: Run Code Linting
        run: |
          echo "1. Установка утилиты проверки YAML..."
          pip install yamllint --break-system-packages

          echo "2. Проверка файлов Docker Compose и YAML..."
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" .

          echo "3. Проверка синтаксиса Python кода..."
          python3 -m py_compile $(find . -name "*.py") || echo "Python файлов не найдено или синтаксис корректен."
