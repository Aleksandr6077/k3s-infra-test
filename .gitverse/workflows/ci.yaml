name: Ci

on:
  push:
    branches:
      - master
  pull_request:
    branches: 
      - master
  workflow_dispatch:

jobs:
  devsecops_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 0. Линтинг YAML (Проверка синтаксиса и отступов)
      - name: Запуск Yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_data: |
            extends: default
            rules:
              line-length: disable
              document-start: disable

      # 1. GitLeaks — Сканирование секретов
      - name: Запуск GitLeaks (Поиск секретов)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. Trivy — ЗАГЛУШКА
      - name: Запуск Trivy Config Scan
        run: |
          echo "→ Trivy: ЗАГЛУШКА (тестирование уведомлений)"
          echo "✅ Trivy config scan passed (stub)"
        continue-on-error: false

      # 3. Kube-score — ЗАГЛУШКА
      - name: Запуск Kube-score (Линтер манифестов)
        run: |
          echo "→ Kube-score: ЗАГЛУШКА (тестирование уведомлений)"
          echo "✅ Kube-score passed (stub)"
        continue-on-error: false

      # 3.5. Kubernetes Dry-Run — ЗАГЛУШКА
      - name: Запуск Kubernetes Dry-Run (Валидация на кластере)
        run: |
          echo "→ K8s Dry-Run: ЗАГЛУШКА (проверка манифестов через kubectl)"
          echo "✅ Kubernetes dry-run passed (stub)"
        continue-on-error: false

      # 4. Уведомление в Telegram при УСПЕШНОМ прохождении
      - name: Уведомление в Telegram (Успех)
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://telegram.org{TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id=${TELEGRAM_CHAT_ID} \
            -d parse_mode=HTML \
            -d text="✅ <b>Пайплайн k3s-infra-test</b> успешно пройден!%0AКоммит: ${{ github.event.head_commit.message }}"

      # 5. Уведомление в Telegram при ПАДЕНИИ
      - name: Уведомление в Telegram (Ошибка)
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://telegram.org{TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id=${TELEGRAM_CHAT_ID} \
            -d parse_mode=HTML \
            -d text="❌ <b>Пайплайн k3s-infra-test</b> завален!%0AПроверьте логи сборки безопасности in GitVerse.%0AАвтор коммита: ${{ github.actor }}"

















