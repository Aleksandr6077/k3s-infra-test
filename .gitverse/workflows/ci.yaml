name: Ci

# Триггеры запуска (адаптировано под ветку master)
on:
  push:
    branches:
      - master
  pull_request:
    branches: 
      - master
  workflow_dispatch:

jobs:
  devsecops_pipeline:
    # Запуск на стандартном облачном раннере
    runs-on: ubuntu-latest

    steps:
      # Шаг 1: Клонируем репозиторий в воркспейс раннера
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      # Шаг 2: Проверка истории коммитов на зашитые пароли и токены
      - name: Запуск GitLeaks (Поиск секретов)
        uses: zricethezav/gitleaks-action@v2
        # Не игнорируем ошибки: если секрет найден — пайплайн упадет
        continue-on-error: false

      # Шаг 3: Проверка манифестов Kubernetes/K3s на уязвимости безопасности
      - name: Запуск Trivy Config Scan
        uses: aquasec/trivy-action@master
        with:
          scan-type: 'config'
          severity: 'HIGH,CRITICAL'
          exit-code: '1' # Уронит пайплайн при критических проблемах

      # Шаг 4: Валидация k8s манифестов на соответствие Best Practices через Docker
      - name: Запуск Kube-score (Линтер манифестов)
        run: |
          docker run --rm -v $(pwd):/project -w /project zegl/kube-score:latest score *.yaml
        continue-on-error: false

      # Шаг 5: Отправка уведомления в Telegram при УСПЕШНОМ прохождении всех шагов
      - name: Уведомление в Telegram (Успех)
        if: success() # Сработает только если шаги 2, 3 и 4 завершились без ошибок
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -X POST "https://telegram.org{TELEGRAM_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" \
          -d "text=✅ Пайплайн проекта k3s-infra-test успешно пройден!%0AКоммит: ${{ github.event.head_commit.message }}"

      # Шаг 6: Отправка уведомления в Telegram при ПАДЕНИИ любого из шагов безопасности
      - name: Уведомление в Telegram (Ошибка)
        if: failure() # Сработает, если GitLeaks, Trivy или Kube-score нашли уязвимость
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -X POST "https://telegram.org{TELEGRAM_TOKEN}/sendMessage" \
          -d "chat_id=${TELEGRAM_CHAT_ID}" \
          -d "text=❌ Пайплайн проекта k3s-infra-test завален!%0AПроверьте логи сборки безопасности в GitVerse.%0AАвтор коммита: ${{ github.actor }}"













