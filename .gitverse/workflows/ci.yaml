name: Simple Ci

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 1. СЕКЬЮРИТИ: Скачивание и запуск Gitleaks
      - name: Run Gitleaks (Secret Scanner)
        run: |
          GITLEAKS_VERSION=$(curl -s "https://github.com" | grep -Po '"tag_name": "v\K[0-9.]+')
          wget -qO gitleaks.tar.gz https://github.com{GITLEAKS_VERSION}_linux_x64.tar.gz
          sudo tar xf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -rf gitleaks.tar.gz
          gitleaks detect --verbose --redact

      # 2. СЕКЬЮРИТИ: Скачивание и запуск Trivy
      - name: Run Trivy vulnerability scanner (IaC)
        run: |
          wget -q https://github.com(lsb_release -sr)_Linux-64bit.deb
          sudo dpkg -i trivy_*.deb
          rm -f trivy_*.deb
          trivy config --exit-code 1 --severity CRITICAL,HIGH .

      # 3. ЛИНТЕР: Проверка синтаксиса YAML
      - name: Run YAMLLint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: '.'

      # 4. ВАЛИДАЦИЯ: Скачивание Kubeconform
      - name: Setup Kubeconform
        run: |
          KUBECONFORM_VERSION=$(curl -s "https://api.github.com/repos/yannh/kubeconform/releases/latest" | grep -Po '"tag_name": "v\K[0-9.]+')
          wget -qO kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz
          sudo tar xf kubeconform.tar.gz -C /usr/local/bin kubeconform
          rm -rf kubeconform.tar.gz
          kubeconform -v

      # 5. ВАЛИДАЦИЯ: Запуск проверки манифестов приложений
      - name: Validate apps manifests
        run: kubeconform -summary -strict apps/




