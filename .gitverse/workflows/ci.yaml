name: Ci

on:
  push:
    branches:
      - master
  pull_request:
    branches: 
      - master
  workflow_dispatch:

jobs:
  devsecops_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      # 1. GitLeaks - поиск секретов
      - name: Запуск GitLeaks
        run: |
          echo "--> Скачиваем GitLeaks..."
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          chmod +x ./gitleaks
          echo "--> Запускаем сканирование..."
          ./gitleaks detect --verbose --source .
        continue-on-error: false

      # 2. Trivy - сканирование манифестов
      - name: Запуск Trivy Config Scan
        run: |
          echo "--> Скачиваем Trivy..."
          curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.71.0/trivy_0.71.0_Linux-64bit.tar.gz | tar -xz trivy
          chmod +x ./trivy
          echo "--> Запускаем сканирование манифестов..."
          ./trivy config --severity HIGH,CRITICAL --exit-code 1 .
        continue-on-error: false

      # 3. Kube-score - линтер Kubernetes манифестов
      - name: Запуск Kube-score
        run: |
          echo "--> Скачиваем Kube-score..."
          curl -sSL https://github.com/zegl/kube-score/releases/download/v1.20.0/kube-score_1.20.0_linux_amd64.tar.gz | tar -xz kube-score
          chmod +x ./kube-score
          echo "--> Запускаем линтер..."
          if ls *.yaml *.yml 1> /dev/null 2>&1; then
            ./kube-score score *.yaml *.yml || true
          else
            echo "Файлы *.yaml / *.yml не найдены, пропускаем."
          fi
        continue-on-error: false

      # 4. Уведомление в Telegram — Успех
      - name: Уведомление в Telegram (Успех)
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id=${TELEGRAM_CHAT_ID} \
            -d parse_mode=HTML \
            -d text="✅ <b>Пайплайн k3s-infra-test</b> успешно пройден!%0AКоммит: ${{ github.event.head_commit.message }}"

      # 5. Уведомление в Telegram — Ошибка
      - name: Уведомление в Telegram (Ошибка)
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id=${TELEGRAM_CHAT_ID} \
            -d parse_mode=HTML \
            -d text="❌ <b>Пайплайн k3s-infra-test</b> завален!%0AПроверь логи.%0AАвтор: ${{ github.actor }}"















