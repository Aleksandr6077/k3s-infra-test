name: Simple CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Качаем всю историю для честной работы Gitleaks

      # 1. СЕКЬЮРИТИ: Скачивание и запуск Gitleaks по твоим ссылкам
      - name: Run Gitleaks (Secret Scanner)
        run: |
          echo "Вычисляем актуальную версию и скачиваем Gitleaks..."
          GITLEAKS_VERSION=$(curl -s "https://api.github.com/repos/gitleaks/gitleaks/releases/latest" | grep -Po '"tag_name": "v\K[0-9.]+')
          wget -qO gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/latest/download/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          sudo tar xf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm -rf gitleaks.tar.gz
          echo "Запускаем сканирование репозитория на утечку секретов..."
          gitleaks detect --verbose --redact

      # 2. СЕКЬЮРИТИ: Скачивание и запуск Trivy по твоим ссылкам
      - name: Run Trivy vulnerability scanner (IaC)
        run: |
          echo "Скачиваем и устанавливаем официальный .deb пакет Trivy..."
          wget -q https://github.com/aquasecurity/trivy/releases/latest/download/trivy_$(lsb_release -sr)_Linux-64bit.deb
          sudo dpkg -i trivy_*.deb
          rm -f trivy_*.deb
          echo "Запускаем сканирование IaC манифестов на уязвимости..."
          trivy config --exit-code 1 --severity CRITICAL,HIGH .

      # 3. ЛИНТЕР: Проверка синтаксиса YAML
      - name: Run YAMLLint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: '.'

      # 4. ВАЛИДАЦИЯ: Кроссплатформенная установка Kubeconform из официального экшена
      - name: Set up Kubeconform
        uses: bmuschko/setup-kubeconform@v1

      # 5. ВАЛИДАЦИЯ: Запуск проверки манифестов приложений
      - name: Validate apps manifests
        run: kubeconform -summary -strict apps/



