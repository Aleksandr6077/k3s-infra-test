name: Build Custom Runner & Notify

on:
  push:
    branches:
      - master
    paths:
      - 'Dockerfile.runner'
      - '.gitverse/workflows/ci.yaml'

jobs:
  build-and-push:
    # Изменено: теперь задача гарантированно пойдет локальный раннер
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitVerse Container Registry
        uses: docker/login-action@v3
        with:
          registry: hub.gitverse.ru
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and Push Custom Runner
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.runner
          push: true
          tags: hub.gitverse.ru/aleksandr607/custom-runner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Send Success Notification
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🔔 *Runner Build: SUCCESS*
            
            Проект: `k3s-infra-test`
            Образ: `hub.gitverse.ru/aleksandr607/custom-runner:latest`
            Статус: Новый образ раннера успешно собран и запушен в GitVerse Registry!
            
            Логи сборки: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Send Failure Notification
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚨 *Runner Build: FAILED*
            
            Проект: `k3s-infra-test`
            Статус: Крах при сборке кастомного Docker-раннера.
            
            Срочно проверь логи: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}








