kind: pipeline
type: docker
name: security-and-notify

steps:
  # 1. Проверка на секреты (GitLeaks)
  - name: gitleaks-scan
    image: zricethezav/gitleaks:latest
    commands:
      - gitleaks detect --verbose --source .
    when:
      event: [ push, pull_request ]

  # 2. Проверка манифестов Kubernetes (Trivy)
  - name: trivy-scan
    image: aquasec/trivy:latest
    commands:
      - trivy config --severity HIGH,CRITICAL --exit-code 1 .
    when:
      event: [ push, pull_request ]

  # 3. (Kubeform/Kube-score)
  - name: kubernetes-lint
    image: zegl/kube-score:latest
    commands:
      - kube-score score *.yaml
    when:
      event: [ push, pull_request ]

  # 4. Уведомление в Telegram об успешном прохождении всех проверок
  - name: notify-telegram-success
    image: curlimages/curl:latest
    environment:
      TELEGRAM_TOKEN:
        from_secret: TELEGRAM_TOKEN
      TELEGRAM_CHAT_ID:
        from_secret: TELEGRAM_CHAT_ID
    commands:
      - |
        curl -X POST "https://telegram.org{TELEGRAM_TOKEN}/sendMessage" \
        -d "chat_id=${TELEGRAM_CHAT_ID}" \
        -d "text=✅ Пайплайн проекта k3s-infra-test успешно пройден!%0AСборка: #${CI_BUILD_NUMBER}%0AКоммит: ${CI_COMMIT_MESSAGE}"
    when:
      status: [ success ]
      event: [ push, pull_request ]

  # 5. Уведомление в Telegram, если какой-то из этапов безопасности упал
  - name: notify-telegram-failure
    image: curlimages/curl:latest
    environment:
      TELEGRAM_TOKEN:
        from_secret: TELEGRAM_TOKEN
      TELEGRAM_CHAT_ID:
        from_secret: TELEGRAM_CHAT_ID
    commands:
      - |
        curl -X POST "https://telegram.org{TELEGRAM_TOKEN}/sendMessage" \
        -d "chat_id=${TELEGRAM_CHAT_ID}" \
        -d "text=❌ Пайплайн проекта k3s-infra-test завален!%0AПроверьте логи сборки #${CI_BUILD_NUMBER}.%0AАвтор: ${CI_COMMIT_AUTHOR}"
    when:
      status: [ failure ]
      event: [ push, pull_request ]











