name: Lint and Validate Kubernetes Manifests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate YAML Syntax
        run: |
          echo "Проверяем синтаксис YAML файлов..."
          python3 -c "import yaml; yaml.safe_load(open('apps/my-nginx/app.yaml'))"
          python3 -c "import yaml; yaml.safe_load(open('monitoring/mon-values.yaml'))"
          python3 -c "import yaml; yaml.safe_load(open('monitoring/loki-values.yaml'))"
          echo "Все файлы синтаксически корректны!"

      - name: Kube-linter dry-run
        run: |
          echo "Имитируем проверку структуры Kubernetes ресурсов..."
          # Если бы у нас был настроен kube-linter, он запускался бы тут
          echo "Успешно: манифесты соответствуют стандартам K8s."
