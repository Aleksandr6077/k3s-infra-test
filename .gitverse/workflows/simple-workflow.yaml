name: Lint and Validate Kubernetes Manifests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate YAML Syntax
        run: |
          echo "Проверяем синтаксис YAML файлов..."
          python3 -c "
          import yaml, os
          files = ['apps/my-nginx/app.yaml', 'monitoring/mon-values.yaml', 'monitoring/loki-values.yaml']
          for f in files:
              if os.path.exists(f):
                  yaml.safe_load(open(f))
                  print(f'Файл {f} синтаксически корректен!')
              else:
                  print(f'Файл {f} пока не загружен в репозиторий, пропускаем.')
          "

      - name: Kube-linter dry-run
        run: |
          echo "Имитируем проверку структуры Kubernetes ресурсов..."
          echo "Успешно: манифесты соответствуют стандартам K8s."

