- name: Настройка отказоустойчивости (Keepalived)
  hosts: loadbalancers
  become: true
  tasks:
    - name: Установка keepalived
      package:
        name: keepalived
        state: present

    - name: Создание конфигурационного файла keepalived
      copy:
        dest: /etc/keepalived/keepalived.conf
        content: |
          vrrp_script check_haproxy {
              script "/usr/bin/killall -0 haproxy"
              interval 2
              weight 2
          }

          vrrp_instance VI_1 {
              state {{ keepalived_role }}
              interface {{ vip_interface }}
              virtual_router_id 51
              priority {{ keepalived_priority }}
              advert_int 1

              authentication {
                  auth_type PASS
                  auth_pass K3sHASecret
              }

              virtual_ipaddress {
                  {{ cluster_vip }}
              }

              track_script {
                  check_haproxy
              }
          }

    - name: Запуск и включение службы keepalived
      service:
        name: keepalived
        state: restarted
        enabled: yes
