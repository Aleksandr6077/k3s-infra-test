---
# ==============================================================================
# 1. Установка prerequisites на ВСЕ ноды (мастера + воркеры)
# ==============================================================================
- name: Установка open-iscsi и nfs-common на все ноды
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
    state: present
    update_cache: yes
  become: true
  when: inventory_hostname in groups['k3s_masters'] + groups['k3s_workers']

- name: Включение и запуск iscsid
  ansible.builtin.systemd:
    name: iscsid
    enabled: yes
    state: started
  become: true
  when: inventory_hostname in groups['k3s_masters'] + groups['k3s_workers']

# ==============================================================================
# 2. Установка Longhorn через Helm (на localhost, через kubeconfig)
# ==============================================================================
- name: Добавление Helm-репозитория Longhorn
  kubernetes.core.helm_repository:
    name: longhorn
    repo_url: https://charts.longhorn.io
  delegate_to: localhost
  run_once: true

- name: Установка Longhorn
  kubernetes.core.helm:
    name: longhorn
    chart_ref: longhorn/longhorn
    chart_version: "{{ longhorn_chart_version }}"
    release_namespace: "{{ longhorn_namespace }}"
    create_namespace: yes
    kubeconfig: "{{ playbook_dir }}/.kube/config"
    values:
      persistence:
        defaultClassReplicaCount: "{{ longhorn_replica_count }}"
      defaultSettings:
        defaultReplicaCount: "{{ longhorn_replica_count }}"
  delegate_to: localhost
  run_once: true

# ==============================================================================
# 3. Ожидание готовности Longhorn
# ==============================================================================
- name: Ожидание готовности подов Longhorn
  kubernetes.core.k8s_info:
    kubeconfig: "{{ playbook_dir }}/.kube/config"
    kind: Pod
    namespace: "{{ longhorn_namespace }}"
    label_selectors:
      - app = longhorn-ui
  register: longhorn_ui_pod
  until: longhorn_ui_pod.resources | length > 0 and longhorn_ui_pod.resources[0].status.phase == "Running"
  retries: 30
  delay: 10
  delegate_to: localhost
  run_once: true
