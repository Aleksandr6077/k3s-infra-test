---
# ==============================================================================
# ОС-уровень: Установка prerequisites на все физические ноды кластера
# ==============================================================================
- name: Установка open-iscsi и nfs-common на все ноды кластера
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
    state: present
    update_cache: yes
  become: true
  when: inventory_hostname in groups['k3s_masters'] + groups['k3s_workers']

- name: Активация и запуск демона iscsid на нодах
  ansible.builtin.systemd:
    name: iscsid
    enabled: yes
    state: started
  become: true
  when: inventory_hostname in groups['k3s_masters'] + groups['k3s_workers']
