---
- name: Создаем изолированную директорию для конфигов внутри проекта
  ansible.builtin.file:
    path: "{{ playbook_dir }}/.kube"
    state: directory
    mode: '0700'
  delegate_to: localhost
  run_once: true

- name: Читаем оригинальный kubeconfig с удаленного мастера K3s
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: remote_kubeconfig
  run_once: true
  become: true
  delegate_to: "{{ groups['k3s_masters'][0] }}"

- name: Сохраняем kubeconfig в локальную папку проекта
  ansible.builtin.copy:
    content: "{{ remote_kubeconfig['content'] | b64decode }}"
    dest: "{{ playbook_dir }}/.kube/config"
    mode: '0600'
    force: yes
  delegate_to: localhost
  run_once: true

- name: Принудительно устанавливаем server = 127.0.0.1 в kubeconfig
  ansible.builtin.replace:
    path: "{{ playbook_dir }}/.kube/config"
    regexp: 'server: https://.*:6443'
    replace: 'server: https://127.0.0.1:6443'
  delegate_to: localhost
  run_once: true





