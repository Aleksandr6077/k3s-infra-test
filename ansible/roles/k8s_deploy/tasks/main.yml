- name: Генерация локального keepalived.conf из Ansible Vault
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: "{{ playbook_dir }}/../local-infra/haproxy/keepalived.conf"
    mode: '0644'

- name: Генерация локального haproxy.cfg из шаблона Jinja2
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ playbook_dir }}/../local-infra/haproxy/haproxy.cfg"
    mode: '0644'

- name: Перечитываем конфигурацию HAProxy на первом балансировщике (на лету)
  ansible.builtin.command:
    cmd: "docker exec haproxy-1 haproxy -f /usr/local/etc/haproxy/haproxy.cfg -p /run/haproxy.pid -sf $(cat /run/haproxy.pid)"
  delegate_to: localhost
  changed_when: true
  failed_when: false

- name: Перечитываем конфигурацию HAProxy на втором балансировщике (на лету)
  ansible.builtin.command:
    cmd: "docker exec haproxy-2 haproxy -f /usr/local/etc/haproxy/haproxy.cfg -p /run/haproxy.pid -sf $(cat /run/haproxy.pid)"
  delegate_to: localhost
  changed_when: true
  failed_when: false

- name: Перечитываем конфигурацию Keepalived на втором балансировщике (на лету)
  ansible.builtin.command:
    cmd: "docker exec haproxy-2 killall -HUP keepalived"
  delegate_to: localhost
  changed_when: true
  failed_when: false # Защита

- name: Создаем пространство имен monitoring для стека мониторинга
  kubernetes.core.k8s:
    kubeconfig: "{{ hostvars['localhost']['ansible_user_dir'] }}/.kube/config"
    context: default
    name: monitoring
    kind: Namespace
    state: present
  register: ns_creation
  until: ns_creation is success
  retries: 10
  delay: 5

- name: Создаем Kubernetes секрет с паролем от Grafana из Ansible Vault
  kubernetes.core.k8s:
    kubeconfig: "{{ hostvars['localhost']['ansible_user_dir'] }}/.kube/config"
    context: default
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: grafana-admin-credentials
        namespace: monitoring
      type: Opaque
      stringData:
        admin-user: "{{ vault_grafana_admin_user }}"
        admin-password: "{{ vault_grafana_admin_password }}"
  register: secret_creation
  # Наш блок защиты: если API-сервер на секунду задумается, Ansible подождет
  until: secret_creation is success
  retries: 10
  delay: 5

- name: Добавляем Helm-репозитории для Grafana и Prometheus COMMUNITY
  kubernetes.core.helm_repository:
    name: "{{ item.name }}"
    repo_url: "{{ item.url }}"
  loop:
    - { name: 'grafana', url: 'https://grafana.github.io/helm-charts' }
    - { name: 'prometheus-community', url: 'https://prometheus-community.github.io/helm-charts' }

- name: Обновляем локальный кэш Helm-репозиториев
  command: helm repo update
  changed_when: false

- name: Устанавливаем Grafana Loki (Сбор логов)
  kubernetes.core.helm:
    kubeconfig: "{{ hostvars['localhost']['ansible_user_dir'] }}/.kube/config"
    context: default
    name: loki
    chart_ref: grafana/loki
    release_namespace: monitoring
    timeout: 3m
    update_repo_cache: true 
    values_files:
      - "{{ loki_values_path }}"
    state: present
    atomic: true
  register: helm_loki_res
  until: helm_loki_res is success
  retries: 5
  delay: 10

- name: Устанавливаем Prometheus Operator + Grafana (Сбор метрик)
  kubernetes.core.helm:
    kubeconfig: "{{ hostvars['localhost']['ansible_user_dir'] }}/.kube/config"
    context: default
    name: kube-prom
    chart_ref: prometheus-community/kube-prometheus-stack
    release_namespace: monitoring
    timeout: 3m
    update_repo_cache: true 
    values_files:
      - "{{ mon_values_path }}"
    state: present
    atomic: true
  register: helm_prom_res
  until: helm_prom_res is success
  retries: 5
  delay: 10

- name: Применяем кастомный манифест Node Exporter (DaemonSet + Service)
  kubernetes.core.k8s:
    kubeconfig: "{{ hostvars['localhost']['ansible_user_dir'] }}/.kube/config"
    context: default
    state: present
    src: "{{ node_exporter_manifest }}"

- name: Разворачиваем целевое веб-приложение Nginx (PVC + Deployment + Service + Ingress)
  kubernetes.core.k8s:
    kubeconfig: "{{ hostvars['localhost']['ansible_user_dir'] }}/.kube/config"
    context: default
    state: present
    namespace: default
    src: "{{ app_manifest }}"




