---
# ==============================================================================
# ЭТАП 1: Настройка локального окружения разработчика
# ==============================================================================
- name: Настройка локального хоста
  hosts: localhost
  gather_facts: true
  connection: local
  roles:
    - local_env

# ==============================================================================
# ЭТАП 1.5: Установка K3s на облачные виртуалки Яндекса (Автогенерация токена)
# ==============================================================================
- name: Развертывание высокодоступного кластера K3s в Облаке
  hosts: k3s_masters
  become: true
  gather_facts: true
  tasks:
    - name: Инициализация первого мастера K3s (Кластер-инит без хардкода токена)
      ansible.builtin.shell:
        cmd: >
          curl -sfL https://get.k3s.io | sh -s - server 
          --cluster-init 
          --tls-san={{ yandex_lb_ip }} 
          --node-ip={{ ansible_default_ipv4.address }}
        creates: /etc/rancher/k3s/k3s.yaml
      when: inventory_hostname == groups['k3s_masters'][0]

    - name: Ожидание генерации токена кластера на первом мастере
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        state: present
        timeout: 60
      when: inventory_hostname == groups['k3s_masters'][0]

    - name: Чтение сгенерированного токена с первого мастера
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token_encoded
      when: inventory_hostname == groups['k3s_masters'][0]

    - name: Расшаривание токена на все хосты в памяти Ansible
      ansible.builtin.set_fact:
        k3s_cluster_token: "{{ hostvars[groups['k3s_masters'][0]]['k3s_node_token_encoded']['content'] | b64decode | trim }}"
      run_once: true

    - name: Ожидание запуска Kubernetes API на первом мастере
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['k3s_masters'][0]]['ansible_default_ipv4'].address }}"
        port: 6443
        delay: 5
        timeout: 60
        state: started
      when: inventory_hostname != groups['k3s_masters'][0]

    - name: Подключение остальных мастеров к кворуму кластера (Используем динамический токен)
      ansible.builtin.shell:
        cmd: >
          curl -sfL https://get.k3s.io | sh -s - server 
          --server https://{{ hostvars[groups['k3s_masters'][0]]['ansible_default_ipv4'].address }}:6443 
          --tls-san={{ yandex_lb_ip }} 
          --node-ip={{ ansible_default_ipv4.address }}
          --token={{ k3s_cluster_token }}
        creates: /etc/rancher/k3s/k3s.yaml
      when: inventory_hostname != groups['k3s_masters'][0]
      throttle: 1  # Подключаем ноды строго по одной, чтобы etcd успевал реплицироваться

# ==============================================================================
# ЭТАП 2: Подключение к кластеру и забор Kubeconfig
# ==============================================================================
- name: Экспорт доступов из кластера K3s
  hosts: k3s_masters
  gather_facts: false
  roles:
    - k3s_kubeconfig

# ==============================================================================
# ЭТАП 3: Развертывание GitOps-фундамента (ArgoCD через Helm)
# ==============================================================================
- name: Подготовка GitOps-оператора в Kubernetes
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all/vars.yml   
    - ../group_vars/all/vault.yml  
  pre_tasks:
    - name: Динамическое обновление адреса API-сервера на IP облачного балансировщика
      ansible.builtin.replace:
        path: "{{ playbook_dir }}/.kube/config"
        regexp: 'server: https://127.0.0.1:6443'
        replace: "server: https://{{ yandex_lb_ip }}:6443"

  tasks:
    # 1. Добавляем официальный Helm-репозиторий Argo
    - name: Добавить Helm-репозиторий ArgoCD
      kubernetes.core.helm_repository:
        name: argo
        repo_url: "https://argoproj.github.io/argo-cd"

    # 2. Ставим ArgoCD через Helm с учетом специфики его CRD
    - name: Установить ArgoCD через Helm
      kubernetes.core.helm:
        kubeconfig: "{{ playbook_dir }}/.kube/config"
        release_name: argocd
        chart_ref: argo/argo-cd
        chart_version: "7.3.11" # Всегда фиксируй версию чарта на проде, чтобы деплой был предсказуем
        release_namespace: argocd
        create_namespace: true
        server_side_apply: true # КРИТИЧНО: включает server-side apply для пролезания тяжелых CRD ArgoCD
        values:
          server:
            # Настройка ingress/сервиса. Для локального WSL2/K3s лучше оставить ClusterIP 
            # и ходить через Ingress (Traefik), который у тебя уже есть.
            service:
              type: ClusterIP

    # 3. Деплоим наш манифест-мост, который свяжет Git и Кубер
    - name: Деплой ArgoCD Application для Nginx
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/.kube/config"
        state: present
        src: "{{ playbook_dir }}/k8s/platform/argocd-apps/nginx-app.yaml"





