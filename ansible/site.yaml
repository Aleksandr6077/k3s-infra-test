---
# ==============================================================================
# ЭТАП 1: Настройка локального окружения разработчика
# ==============================================================================
- name: Настройка локального хоста
  hosts: localhost
  gather_facts: true
  connection: local
  roles:
    - local_env

# ==============================================================================
# ЭТАП 1.5: Установка K3s на облачные виртуалки Яндекса (Автогенерация токена)
# ==============================================================================
- name: Развертывание высокодоступного кластера K3s в Облаке
  hosts: k3s_masters
  become: true
  gather_facts: false
  tasks:

    - name: "SRE-Guard: Ожидаем полной готовности SSH-демона в ОС"
      ansible.builtin.wait_for:
        host: "{{ ansible_host | default(inventory_hostname) }}"
        port: 22
        state: started
        delay: 5
        timeout: 120

    - name: Включение сбора фактов после успешного подключения
      ansible.builtin.setup:

    - name: Проверяем, установлен ли K3s
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary
      when: inventory_hostname == groups['k3s_masters'][0]

    - name: Инициализация первого мастера K3s
      ansible.builtin.shell:
        cmd: >
          curl -sfL https://get.k3s.io | sh -s - server 
          --cluster-init
          --node-ip={{ ansible_default_ipv4.address }}
      when:
        - inventory_hostname == groups['k3s_masters'][0]
        - not k3s_binary.stat.exists

    - name: Ожидание генерации токена кластера на первом мастере
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        state: present
        timeout: 60
      when: inventory_hostname == groups['k3s_masters'][0]

    - name: Чтение сгенерированного токена с первого мастера
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_node_token_encoded
      when: inventory_hostname == groups['k3s_masters'][0]

    - name: Расшаривание токена на все хосты в памяти Ansible
      ansible.builtin.set_fact:
        k3s_cluster_token: "{{ hostvars[groups['k3s_masters'][0]]['k3s_node_token_encoded']['content'] | b64decode | trim }}"
      when: hostvars[groups['k3s_masters'][0]]['k3s_node_token_encoded'] is defined
      run_once: true

    - name: Ожидание запуска Kubernetes API на первом мастере
      ansible.builtin.wait_for:
        host: "{{ hostvars[groups['k3s_masters'][0]]['ansible_default_ipv4'].address }}"
        port: 6443
        delay: 5
        timeout: 60
        state: started
      when: inventory_hostname != groups['k3s_masters'][0]

    - name: Проверяем, установлен ли K3s на остальных мастерах
      ansible.builtin.stat:
        path: /usr/local/bin/k3s
      register: k3s_binary_others
      when: inventory_hostname != groups['k3s_masters'][0]

    - name: Подключение остальных мастеров к кворуму кластера
      ansible.builtin.shell:
        cmd: >
          curl -sfL https://get.k3s.io | sh -s - server 
          --server https://{{ hostvars[groups['k3s_masters'][0]]['ansible_default_ipv4'].address }}:6443 
          --node-ip={{ ansible_default_ipv4.address }}
          --token={{ k3s_cluster_token }}
      when:
        - inventory_hostname != groups['k3s_masters'][0]
        - not k3s_binary_others.stat.exists
      throttle: 1

# ==============================================================================
# ЭТАП 2: Подключение к кластеру и забор Kubeconfig
# ==============================================================================
- name: Экспорт доступов из кластера K3s
  hosts: k3s_masters
  gather_facts: false
  roles:
    - k3s_kubeconfig

# ==============================================================================
# ЭТАП 3: Развертывание GitOps-фундамента (Автоматизированный Manifest-деплой)
# ==============================================================================
- name: Подготовка GitOps-оператора в Kubernetes
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all/vars.yml   
    - ../group_vars/all/vault.yml  
  tasks:
    - name: Создание пространства имен для ArgoCD
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/.kube/config"
        name: argocd
        api_version: v1
        kind: Namespace
        state: present

    - name: Установка ArgoCD из официального манифеста (v3.5.1)
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/.kube/config"
        state: present
        src: "https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.1/manifests/install.yaml"
        namespace: argocd
        apply: true
        server_side_apply:
          field_manager: ansible

    - name: Ожидание стабилизации API-схем ArgoCD
      ansible.builtin.pause:
        seconds: 15

    - name: Деплой ArgoCD Application для Nginx
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/.kube/config"
        state: present
        src: "{{ playbook_dir }}/../k8s/platform/argocd-apps/nginx-app.yaml"

    - name: Создание namespace для мониторинга
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/.kube/config"
        name: monitoring
        api_version: v1
        kind: Namespace
        state: present

    - name: Создание Secret с Telegram токеном
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/.kube/config"
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: alertmanager-telegram
            namespace: monitoring
          type: Opaque
          stringData:
            bot_token: "{{ vault_telegram_bot_token }}"
            chat_id: "{{ vault_telegram_chat_id }}"

    - name: Деплой ArgoCD Application для мониторинга
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/.kube/config"
        state: present
        src: "{{ playbook_dir }}/../k8s/platform/argocd-apps/monitoring-app.yaml"

# ==============================================================================
# ЭТАП 4: Установка Longhorn и Traefik HelmChartConfig
# ==============================================================================
- name: Установка Longhorn в кластер K3s
  hosts: localhost
  gather_facts: false
  roles:
    - longhorn
  tasks:
    - name: Копируем Traefik HelmChartConfig
      kubernetes.core.k8s:
        kubeconfig: "{{ playbook_dir }}/.kube/config"
        state: present
        src: "{{ playbook_dir }}/../k8s/platform/traefik-config.yaml"








