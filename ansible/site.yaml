---
# ==============================================================================
# ЭТАП 1: Настройка локального окружения разработчика
# ==============================================================================
- name: Настройка локального хоста WSL2
  hosts: localhost
  gather_facts: true
  connection: local
  roles:
    - wsl_env

# ==============================================================================
# ЭТАП 2: Подключение к кластеру и забор Kubeconfig
# ==============================================================================
- name: Экспорт доступов из кластера K3s
  hosts: k3s-master-1
  gather_facts: false
  roles:
    - k3s_kubeconfig

# ==============================================================================
# ЭТАП 3: Деплой инфраструктуры мониторинга и приложений
# ==============================================================================
- name: Развертывание сервисов в Kubernetes
  hosts: localhost
  gather_facts: false
  vars_files:
    - roles/k8s_deploy/vars/secrets.yaml
  roles:
    - k8s_deploy
