name: DevSecOps Infrastructure Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Отменяем предыдущий запуск при новом пуше в ту же ветку
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Минимальные права — только чтение
permissions:
  contents: read
  pull-requests: read

jobs:
  validate_and_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0

      # ============================================================
      # 1. ВАЛИДАЦИЯ YAML
      # ============================================================
      - name: Validate YAML Syntax
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: '.'
          config_file: '.yamllint.yml'

      # ============================================================
      # 2. COMMITLINT — проверка сообщений коммитов
      # ============================================================
      - name: Validate Commit Messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: ".commitlintrc.yml"

      # ============================================================
      # 3. GITLEAKS — поиск секретов
      # ============================================================
      - name: Run GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.2
          cache: true

      # 4. TRIVY — IaC
      - name: Run Trivy IaC Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          hide-progress: false
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          skip-setup-trivy: true

      # 5. TRIVY — образы
      - name: Run Trivy Image Scan (nginx)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "nginx:1.27-alpine"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          skip-setup-trivy: true

      # Раскомментировать, для своих образов:
      # - name: Run Trivy Image Scan (backend)
      #   uses: aquasecurity/trivy-action@0.36.0
      #   with:
      #     image-ref: 'ghcr.io/<you>/fastapi-backend:latest'
      #     format: 'table'
      #     exit-code: '1'
      #     severity: 'CRITICAL,HIGH'
      #     ignore-unfixed: true

      # ============================================================
      # 6. KUBE-SCORE — best practices для k8s-манифестов
      # ============================================================
      - name: Run kube-score
        run: |
          curl -sSL https://github.com/zegl/kube-score/releases/download/v1.19.0/kube-score_1.19.0_linux_amd64.tar.gz \
            | tar -xz -C /usr/local/bin
          find k8s -name "*.yaml" -not -path "k8s/apps/nginx/templates/*" | xargs kube-score score --output-format ci

      # ============================================================
      # 7. УВЕДОМЛЕНИЯ В TELEGRAM
      # ============================================================
      - name: Telegram Notification (Success)
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" || echo "New commit")
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="✅ <b>Пайплайн k3s-infra-test успешно пройден!</b>%0A<b>Коммит:</b> ${COMMIT_MSG}%0A<b>Автор:</b> ${{ github.actor }}" \
            > /dev/null

      - name: Telegram Notification (Failure)
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sf -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>Пайплайн k3s-infra-test ЗАВАЛЕН!</b>%0AПроверьте логи сборки безопасности.%0A<b>Автор коммита:</b> ${{ github.actor }}" \
            > /dev/null
