name: Ci

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  devsecops_pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Клонируем репозиторий проекта
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Необходимо для корректной работы Gitleaks истории

      # 1. Быстрая валидация синтаксиса YAML (через встроенный инструмент)
      - name: Запуск Валидации YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint.yml # если нет, проверит базовый синтаксис
        continue-on-error: false

      # 2. Сканирование секретов через официальный Docker-образ Gitleaks
      - name: Запуск GitLeaks (Поиск секретов)
        run: |
          docker run --rm -v ${{ github.workspace }}:/path zricethezav/gitleaks:latest detect --source=/path --verbose --redact

      # 3. запуск Trivy
      - name: Запуск Trivy Config Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: true
          exit-code: '1' # Уронить пайплайн, если найдены критические уязвимости
          severity: 'CRITICAL,HIGH'

      # 4. Реальный запуск Kube-score (Линтер манифестов на соответствие Best Practices)
      - name: Запуск Kube-score
        run: |
          # Скачиваем pre-compiled бинарник kube-score
          curl -sLO https://github.com/zegl/kube-score/releases/download/v1.20.0/kube-score_1.20.0_linux_amd64
          tar -xf kube-score_1.18.0_linux_amd64.tar.gz
          
          echo "→ Запуск анализа новой структуры каталогов приложения..."
          ./kube-score score k8s/apps/nginx/*.yaml

      # 5. Реальный Kubernetes Dry-Run (Валидация манифестов без живого облака)
      - name: Запуск Kubernetes Dry-Run (Валидация схемы через kubeval/kubectl)
        run: |
          # Используем встроенный в runner kubectl + локальный мини-кластер (мимикрия)
          # Или проверяем соответствие схемы через dry-run в режиме клиента
          echo "→ Проверка клиентской валидации манифестов..."
          kubectl apply --dry-run=client -f k8s/apps/nginx/

      # 6. Уведомление в Telegram при УСПЕШНОМ прохождении
      - name: Уведомление в Telegram (Успех)
        if: success()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" || echo "Не удалось определить коммит")
          curl -s -X POST "https://telegram.org{TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="✅ <b>Пайплайн k3s-infra-test успешно пройден!</b>%0A<b>Коммит:</b> ${COMMIT_MSG}"

      # 7. Уведомление в Telegram при ПАДЕНИИ
      - name: Уведомление в Telegram (Ошибка)
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://telegram.org{TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="❌ <b>Пайплайн завален!</b>%0AПроверьте логи сборки безопасности.%0A<b>Автор коммита:</b> ${{ github.actor }}"























