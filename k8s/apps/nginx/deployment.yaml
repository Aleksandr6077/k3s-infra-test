apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx
  namespace: default
  labels:
    app: my-nginx
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: my-nginx
  template:
    metadata:
      labels:
        app: my-nginx
    spec:
      affinity:
        podAntiAffinity:
          # НАДЕЖНОСТЬ: Изменено на жесткое правило. Поды ОБЯЗАНЫ разворачиваться на разных нодах.
          # Если одна нода упадет, вторая продолжит держать 100% трафика без деградации до SPOF.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - my-nginx
              topologyKey: "kubernetes.io/hostname"

      # БЕЗОПАСНОСТЬ: Изоляция на уровне пода
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault # Защита от системных вызовов мимо рантайма кубера

      initContainers:
      - name: init-html
        image: alpine:3.19
        command: 
          - 'sh'
          - '-c'
          - 'echo "<h1>Hello from k3s inside WSL2! DevOps is working!</h1>" > /data/index.html && chown -R 101:101 /data'
        securityContext:
          runAsUser: 0 # Root нужен только для chown на внешнем томе
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true # Запрет на мутацию самого образа alpine
          capabilities:
            drop:
              - ALL # Полный сброс прав Linux ядра
            add:
              - CHOWN   # Разрешаем только смену владельца файлов
              - FOWNER  # Разрешаем управлять правами без сверки с UID владельца
        volumeMounts:
        - name: nginx-storage
          mountPath: /data
        - name: ephemeral-tmp
          mountPath: /tmp

      containers:
      - name: nginx
        image: nginxinc/nginx-unprivileged:1.25-alpine
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "200m"

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true   # Корень контейнера полностью заблокирован на запись
          capabilities:
            drop:
              - ALL # Чистый non-privileged процесс без системных капабилити

        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10 && nginx -s quit"] # Graceful shutdown для очистки сессий в Traefik

        # ОПТИМИЗАЦИЯ: Ускорен запуск первой проверки. Легковесный Nginx готов принимать трафик сразу.
        readinessProbe:
          httpGet:
            path: /index.html
            port: 8080
          initialDelaySeconds: 1 
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /index.html
            port: 8080
          initialDelaySeconds: 5 
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        
        volumeMounts:
        - name: nginx-storage
          mountPath: /usr/share/nginx/html
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        # ИСПРАВЛЕНИЕ: Мапим /var/tmp в emptyDir. Сюда Nginx сбрасывает буфер больших POST-запросов.
        - name: ephemeral-tmp
          mountPath: /var/tmp
        - name: ephemeral-tmp
          mountPath: /tmp

      volumes:
      - name: nginx-storage
        persistentVolumeClaim:
          claimName: nginx-pvc
      # Все временные директории монтируются как emptyDir (в RAM-диск), чтобы не писать на readOnlyRootFilesystem
      - name: nginx-cache
        emptyDir:
          medium: Memory
      - name: nginx-run
        emptyDir:
          medium: Memory
      - name: ephemeral-tmp
        emptyDir:
          medium: Memory


