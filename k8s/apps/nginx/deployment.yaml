apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx
  namespace: default
  labels:
    app: my-nginx
spec:
  replicas: 2 # Защита от Downtime. Всегда минимум 2 реплики в проме
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1       # Создавать 1 новый под перед удалением старого
      maxUnavailable: 0 # 100% доступность во время деплоя
  selector:
    matchLabels:
      app: my-nginx
  template:
    metadata:
      labels:
        app: my-nginx
    spec:
      # Запрещаем планировать обе реплики на одну ноду, если их в кластере несколько
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - my-nginx
                topologyKey: "kubernetes.io/hostname"

      # БЕЗОПАСНОСТЬ: Запрещаем root на уровне всего Пода
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # ID пользователя nginx в unprivileged образах
        fsGroup: 101

      initContainers:
      - name: init-html
        image: alpine:3.19
        command: 
          - 'sh'
          - '-c'
          - 'echo "<h1>Hello from k3s inside WSL2! DevOps is working!</h1>" > /data/index.html && chown -R 101:101 /data'
        securityContext:
          runAsUser: 0 # Роут нужен только init-контейнеру для chown прав доступа
        volumeMounts:
        - name: nginx-storage
          mountPath: /data

      containers:
      - name: nginx
        # ИСПОЛЬЗУЕМ: Специальный non-root enterprise образ от авторов Nginx
        image: nginxinc/nginx-unprivileged:1.25-alpine
        ports:
        - containerPort: 8080 # Внимание! Non-root процессы слушают порты > 1024 (дефолт 8080)
          name: http
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "200m" # Увеличили лимит по CPU до 200m, 100m на проде будет душить аппликейшн (Throttling)

        # SRE: Graceful Shutdown механика
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 10 && nginx -s quit"] 
              # Поток спит 10 сек, давая Traefik время исключить под из балансировки,
              # после чего Nginx мягко дорабатывает текущие сессии и завершается.

        # ИСПРАВЛЕННЫЕ ПРОБЫ (на порт 8080)
        readinessProbe:
          httpGet:
            path: /index.html
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /index.html
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
        volumeMounts:
        - name: nginx-storage
          mountPath: /usr/share/nginx/html

      volumes:
      - name: nginx-storage
        persistentVolumeClaim:
          claimName: nginx-pvc
