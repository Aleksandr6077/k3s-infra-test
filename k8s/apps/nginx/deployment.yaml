---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx
  namespace: default
  labels:
    app: my-nginx
spec:
  replicas: 1
  revisionHistoryLimit: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: my-nginx
  template:
    metadata:
      labels:
        app: my-nginx
    spec:
      affinity:
        podAntiAffinity:
          # НАДЕЖНОСТЬ: Изменено на жесткое правило. Поды ОБЯЗАНЫ разворачиваться на разных нодах.
          # Если одна нода упадет, вторая продолжит держать 100% трафика без деградации до SPOF.
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - my-nginx
              topologyKey: "kubernetes.io/hostname"

      # БЕЗОПАСНОСТЬ: Изоляция на уровне пода
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: init-html
          image: alpine:3.19
          command:
            - 'sh'
            - '-c'
            - 'cp /config/index.html /data/index.html'
          volumeMounts:
            - name: nginx-storage
              mountPath: /data
            - name: nginx-init-config
              mountPath: /config
              readOnly: true
            - name: ephemeral-tmp
              mountPath: /tmp

      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.25-alpine
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "64Mi"
              cpu: "200m"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10 && nginx -s quit"]

          readinessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /index.html
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          volumeMounts:
            - name: nginx-storage
              mountPath: /usr/share/nginx/html
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: ephemeral-tmp
              mountPath: /var/tmp
            - name: ephemeral-tmp
              mountPath: /tmp

      volumes:
        - name: nginx-storage
          persistentVolumeClaim:
            claimName: nginx-pvc
        - name: nginx-init-config
          configMap:
            name: nginx-init-html
        - name: nginx-cache
          emptyDir:
            medium: Memory
        - name: nginx-run
          emptyDir:
            medium: Memory
        - name: ephemeral-tmp
          emptyDir:
            medium: Memory