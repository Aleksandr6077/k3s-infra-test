apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: yandex-lockbox-store
    kind: SecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: "e6qs0e92c762ib8ic6v6"
        property: grafana_admin_user
    - secretKey: admin-password
      remoteRef:
        key: "e6qs0e92c762ib8ic6v6"
        property: grafana_admin_password
