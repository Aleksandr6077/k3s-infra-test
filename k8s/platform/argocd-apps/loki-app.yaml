apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki
    # TODO(применение): прибить к конкретной версии перед применением.
    # Проверить актуальную
    targetRevision: 6.16.0
    helm:
      valueFiles:
        - values-loki.yaml
      # Если values лежат в Git рядом с Application — используем
      # multi-source, либо кладём values в отдельный repo.
      # Сейчас — предполагаем, что values в том же repo, что и Application,

  destination:
    server: https://kubernetes.default.svc
    namespace: logging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
