---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn-storage
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io # Защита
spec:
  project: default
  source:
    repoURL: 'https://charts.longhorn.io/'
    targetRevision: 1.7.2  # Фиксируем версию чарта
    chart: longhorn
    helm:
      values: |
        persistence:
          defaultClassReplicaCount: 2
        defaultSettings:
          defaultReplicaCount: 2
          upgradeChecker: false
        preUpgradeChecker:
          jobEnabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: longhorn-system # Автоматический деплой в изолированный namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
