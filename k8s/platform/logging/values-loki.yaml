# ==============================================================================
# Loki — SingleBinary mode для эфемерного стенда
# Чарт: grafana/loki
# Docs: https://grafana.com/docs/loki/latest/setup/install/helm/install-monolithic/
# ==============================================================================

deploymentMode: SingleBinary

loki:
  commonConfig:
    replication_factor: 1

  # TODO(решение): filesystem vs S3 (Yandex Object Storage)
  # Для эфемерного стенда — filesystem достаточно.
  # Для production — S3, чтобы данные переживали кластер.
  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  pattern_ingester:
    enabled: true

  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    # TODO(отладка): ужать retention, если Loki жрёт диск
    # retention_period: 168h  # 7 дней

  ruler:
    enable_api: true

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    size: 10Gi
    storageClass: longhorn

  # TODO(решение): зависит от A/B/C по воркерам.
  # Loki single-binary ~256-512 МБ RAM.
  # На 2x4 ГБ — впритык, на 3x4 ГБ — комфортно.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ==============================================================================
# Обнуляем все микросервисы — используем только SingleBinary
# ==============================================================================
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

# MinIO не нужен — используем filesystem
minio:
  enabled: false

# ==============================================================================
# Gateway — нужен, чтобы Alloy и Grafana ходили через одну точку
# ==============================================================================
gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
