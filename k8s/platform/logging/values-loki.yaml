# ==============================================================================
# Loki — SingleBinary mode для эфемерного стенда
# Чарт: grafana/loki
# Docs: https://grafana.com/docs/loki/latest/setup/install/helm/install-monolithic/
# ==============================================================================

deploymentMode: SimpleScalable

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1

  # Указываем S3
  storage:
    type: s3
    bucketNames:
      chunks: "${LOKI_BUCKET}"
      ruler: "${LOKI_BUCKET}"
    s3:
      endpoint: "storage.yandexcloud.net"
      region: "ru-central1"
      s3ForcePathStyle: true
      # Секреты подтянутся из K8s Secret через extraEnv
      accessKeyId: "${LOKI_ACCESS_KEY}"
      secretAccessKey: "${LOKI_SECRET_KEY}"

  schemaConfig:
    configs:
      - from: "2024-01-01"
        index:
          period: 24h
          prefix: index_
        object_store: s3
        store: tsdb
        schema: v13

  # Подтягиваем переменные окружения из нашего Secret
  extraEnvFrom:
    - secretRef:
        name: loki-s3-credentials

# Отключаем MinIO (он больше не нужен)
minio:
  enabled: false

# Настройки компонентов SimpleScalable
write:
  replicas: 2
  persistence:
    storageClass: "longhorn"
    size: 10Gi
read:
  replicas: 2
backend:
  replicas: 2
  persistence:
    storageClass: "longhorn"
    size: 10Gi

gateway:
  enabled: true
